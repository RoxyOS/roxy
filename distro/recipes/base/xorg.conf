Section "ServerFlags"
    Option "AutoAddDevices" "off"
    Option "AutoEnableDevices" "off"
EndSection

Section "Module"
    Load "fbdev"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "fbdev"
    Option "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "Monitor0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "Monitor0"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "Default Layout"
    Screen 0 "Screen0"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0" "CorePointer"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "evdev"
    Option "Device" "/dev/keyboard_event"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "evdev"
    Option "Device" "/dev/mouse_event"
EndSection

# The legacy psaux (mouse-driver) input device is not enabled here: it defines
# Identifier "Mouse0", which would collide with the evdev Mouse0 referenced by
# the ServerLayout above, and it needs the xf86-input-mouse driver that is not
# part of the base metapackage.  To enable a plain /dev/psaux mouse instead,
# rename its Identifier to "Mouse0", drop the evdev Mouse0, and install
# xf86-input-mouse:
#
# Section "InputDevice"
#     Identifier "Mouse1"
#     Driver "mouse"
#     Option "Protocol" "auto"
#     Option "Device" "/dev/psaux"
# EndSection