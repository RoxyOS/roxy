[package]
name = "kernel-main"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
kernel = []
kernel-test = [
    "dep:linkme",
    "dep:qemu-exit",
    "dep:roxy-test",
    "roxy-test/kernel-test",
    "roxy-arch/kernel-test",
    "roxy-block/kernel-test",
    "roxy-boot/kernel-test",
    "roxy-cpu/kernel-test",
    "roxy-elf/kernel-test",
    "roxy-ext4/kernel-test",
    "roxy-fbterm/kernel-test",
    "roxy-futex/kernel-test",
    "roxy-line-discipline/kernel-test",
    "roxy-ttyfd/kernel-test",
    "roxy-interrupt/kernel-test",
    "roxy-memory/kernel-test",
    "roxy-process/kernel-test",
    "roxy-ps2/kernel-test",
    "roxy-syscall/kernel-test",
    "roxy-terminal/kernel-test",
    "roxy-thread/kernel-test",
    "roxy-time/kernel-test",
    "roxy-vfs/kernel-test",
    "roxy-vm/kernel-test",
]

[[bin]]
name = "kernel-main"
path = "src/main.rs"
test = false
bench = false
required-features = ["kernel"]

[dependencies]
linkme = { workspace = true, optional = true }
qemu-exit = { workspace = true, optional = true }
spin.workspace = true

roxy-arch.workspace = true
roxy-block.workspace = true
roxy-boot.workspace = true
roxy-cpu.workspace = true
roxy-elf.workspace = true
roxy-ext4.workspace = true
roxy-fbterm.workspace = true
roxy-fd.workspace = true
roxy-futex.workspace = true
roxy-input.workspace = true
roxy-interrupt.workspace = true
roxy-line-discipline.workspace = true
roxy-memory.workspace = true
roxy-process.workspace = true
roxy-ps2.workspace = true
roxy-serial.workspace = true
roxy-syscall.workspace = true
roxy-terminal.workspace = true
roxy-test = { workspace = true, optional = true }
roxy-thread.workspace = true
roxy-time.workspace = true
roxy-ttyfd.workspace = true
roxy-vfs.workspace = true
roxy-vm.workspace = true

[lints]
workspace = true
